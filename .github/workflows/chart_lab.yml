name: 차트 실험실 실행

# 보조지표만으로 하는 기술적 분석 실험(2026-11-13 의장). 07시 자료수집·팀Q와 별개, 예약 실행 없음.
# 실험 = app/chart_lab/experiments/<이름>.yaml, 결과 = 드라이브 '콜로키움 수집데이터/차트실험실/<이름>/'
on:
  workflow_dispatch:
    inputs:
      experiment:
        description: '실험 이름(app/chart_lab/experiments/ 의 파일 이름, .yaml 빼고). 여러 개는 띄어쓰기'
        required: true
        default: 'macd_daily_band'

concurrency: chart-lab

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r app/chart_lab/requirements.txt
      - name: 실험
        env:
          TZ: Asia/Seoul
          EXPERIMENT: ${{ github.event.inputs.experiment }}
          DRIVE_URL: ${{ secrets.DRIVE_URL }}
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        run: python app/chart_lab/run.py $EXPERIMENT
      - name: 결과 파일(드라이브와 같은 것, 실행 화면에서도 받기)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chart_lab_out
          path: app/chart_lab/out
          if-no-files-found: ignore
