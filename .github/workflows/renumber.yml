name: 옛 번호 → 층 번호(11/25 한 번)

# 11/25 의장 "코드에서 기존 번호를 쓰던 것을 모두 새 번호로 바꿔. 기록도 바꿔." 드라이브 기록 파일을 한 번 바꾸고, 다 되면 이 파일과 renumber_1125.py는 지운다.
on:
  workflow_dispatch:

concurrency: meeting

jobs:
  renumber:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: 바꾸기
        env:
          DRIVE_URL: ${{ secrets.DRIVE_URL }}
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        run: python app/meeting/renumber_1125.py drive
