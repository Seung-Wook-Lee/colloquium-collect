name: 강의 캡처 받아쓰기

# 유료 강의 슬라이드 캡처 → 제미나이 받아쓰기 → 드라이브 '페르소나 스토리/강의캡처/받아쓰기/'(2026-11-14 의장)
# 의장은 '페르소나 스토리/강의캡처/받는곳/<위원이름>_<출처>_<강의명>/' 폴더에 캡처를 넣고 이 워크플로를 실행(Run workflow).
# 이미 받아쓴 그림은 처리목록.csv로 건너뛰므로 여러 번 눌러도 됨. 결과 txt는 작업 창이 프로젝트 폴더 위원공부/강의/ 로 옮겨 색인.
on:
  workflow_dispatch:

concurrency: lecture

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install requests
      - name: 받아쓰기
        env:
          TZ: Asia/Seoul
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRIVE_URL: ${{ secrets.DRIVE_URL }}
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        run: python app/rag/lecture.py --drive
