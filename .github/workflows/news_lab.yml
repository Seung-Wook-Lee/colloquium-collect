name: 뉴스 실험실

# 기사 후보 모으기 → 제미나이 1차 고르기 → 드라이브 '콜로키움 수집데이터/뉴스실험실/' (2026-11-14 의장)
# 의장은 스트림릿 '뉴스 고르기' 화면에서 쓸 것/버릴 것을 표시한다. 07시 자료수집과 별개.
on:
  schedule:
    - cron: '30 21 * * *'      # UTC 21:30 = 한국 06:30 (GitHub 사정으로 늦을 수 있음)
  workflow_dispatch:
    inputs:
      hours:
        description: '몇 시간 안 기사를 모을지(기본 24)'
        required: false
        default: '24'

concurrency: news-lab

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 후보 모으기·고르기
        env:
          TZ: Asia/Seoul
          NEWS_HOURS: ${{ github.event.inputs.hours || '24' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          DRIVE_URL: ${{ secrets.DRIVE_URL }}
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        run: python collect/news_lab/run.py
      - name: 결과 파일(드라이브와 같은 것)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news_lab_out
          path: collect/news_lab/out
          if-no-files-found: ignore
