name: 시장 판단 L01~L20 검증
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: 비공개 설정(blocks.yaml)
        uses: actions/checkout@v5
        with:
          repository: Seung-Wook-Lee/team_q
          ref: main
          path: team_q_private
          sparse-checkout: colloquium_private
          token: ${{ secrets.TEAMQ_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -q pandas numpy requests pyyaml hmmlearn scipy
      - run: python app/block33/check_layers.py work_cl team_q_private/colloquium_private/blocks.yaml
        env:
          DRIVE_URL: ${{ secrets.DRIVE_URL }}
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
          QC_PRIVATE: ${{ github.workspace }}/team_q_private/colloquium_private
