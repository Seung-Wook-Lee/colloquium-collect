name: 한투 증권사 투자의견(손으로 돌릴 때만)
# 11/26 의장 "최근 일주일 보고서만 참고해", "지금 바로 해". 매일은 저녁 8시 수집(kr_evening.yml)이 같은 접속으로 받는다.
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests pandas pyyaml
      - run: python collect/data/kis_opinion.py
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          DRIVE_URL: ${{ secrets.DRIVE_URL }}
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
