name: fetch_risk
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q pandas requests yfinance
      - run: python collect/research/fetch_risk.py
        env:
          FRED_KEY: ${{ secrets.FRED_KEY }}
      - name: 결과를 data-risk 가지에 올림
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout -B data-risk
          git add -f history/시장위험_장기.csv
          git commit -m "시장 위험 장기 자료 $(date -u +%F)"
          git push -f origin data-risk
