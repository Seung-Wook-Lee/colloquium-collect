name: 역도산 → 시타델 파일 이름(11/25 한 번)
on:
  workflow_dispatch:
concurrency: meeting
jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python collect/data/rename_citadel_1125.py
        env:
          DRIVE_URL: ${{ secrets.DRIVE_URL }}
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
