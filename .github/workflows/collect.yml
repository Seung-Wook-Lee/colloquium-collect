name: 콜로키움 자료수집

on:
  workflow_dispatch:          # Actions 화면의 'Run workflow' 버튼으로 손으로 돌리기
  # 매일 아침 8시(한국) 자동 실행은 의장님이 '시작'이라고 하시면 아래 두 줄의 # 를 지워 켭니다.
  # schedule:
  #   - cron: '0 23 * * *'    # UTC 23:00 = 한국 08:00 (GitHub 사정으로 5~15분 늦을 수 있음)

concurrency: collect          # 두 번 겹쳐 돌지 않게

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 라이브러리 설치
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: 자료 수집
        env:
          TZ: Asia/Seoul
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
          DART_KEY: ${{ secrets.DART_KEY }}
          SEC_EMAIL: ${{ secrets.SEC_EMAIL }}
          DRIVE_URL: ${{ secrets.DRIVE_URL }}
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        run: python run.py
