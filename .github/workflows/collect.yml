name: 스튜디오 톰앤수 자료수집

on:
  workflow_dispatch:          # Actions 화면의 'Run workflow' 버튼으로 손으로 돌리기
    inputs:
      blocks:
        description: '시험으로 돌릴 블록 번호(띄어쓰기로 구분, 예: 9). 비우면 전부'
        required: false
        default: ''
  schedule:                   # 매일 아침 7시(한국) 자동 실행 — 8시 프리장 전에 끝나도록 (2026-10-28 의장 결정)
    - cron: '0 23 * * 0-4'    # 11/25 의장 "자료 수집을 아침 8시, 저녁 8시로": 아침 8시 = 미국 자료(한투 접속 없음). 한국은 kr_evening.yml(저녁 8시)    # 11/21 의장: 주말 쉼(UTC 일~목 = 한국 월~금 아침)      # UTC 22:00 = 한국 07:00 (GitHub 사정으로 몇 분~수십 분 늦을 수 있음)

concurrency: collect          # 두 번 겹쳐 돌지 않게

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120         # 11/19: 공개 저장소라 시간 제한 여유(45분이면 b09_news에서 잘려 드라이브 올리기 전에 취소됨)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: 라이브러리 설치
        run: pip install -r requirements.txt
      - name: 뉴스 감성 모델 라이브러리(FinBERT, CPU판)   # 11/19 의장 B20 제2의 젠슨 황
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install "transformers>=4.40"
      - name: 뉴스 감성 모델 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-finbert-v1
      - name: 자료 수집
        env:
          TZ: Asia/Seoul
          KIS_OFF: '1'                # 11/25 의장: 아침엔 한투 접속 안 함(한국 자료는 저녁 8시)
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
          DART_KEY: ${{ secrets.DART_KEY }}
          SEC_EMAIL: ${{ secrets.SEC_EMAIL }}
          DRIVE_URL: ${{ secrets.DRIVE_URL }}
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          TAVILY_KEY: ${{ secrets.TAVILY_KEY }}
          BLOCKS: ${{ github.event.inputs.blocks }}
        run: python collect/run.py $BLOCKS
      - name: 보조 자료(재무·13F·공매도는 새 공시·새 종목일 때만, 시장위험·사건 RSS) — 회의는 받지 않고 이것만 읽음(11/26 의장)
        if: always() && github.event.inputs.blocks == ''
        env:
          TZ: Asia/Seoul
          KIS_OFF: '1'
          FRED_KEY: ${{ secrets.FRED_KEY }}
          DART_KEY: ${{ secrets.DART_KEY }}
          SEC_EMAIL: ${{ secrets.SEC_EMAIL }}
          DRIVE_URL: ${{ secrets.DRIVE_URL }}
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        run: pip install pyyaml && python collect/data/supplement.py 아침
      - name: 미국 이익 추정치(그날 값만 → 데이터베이스 칸 이익추정, 11/26 의장 "최근 일주일")
        if: always() && github.event.inputs.blocks == ''
        env:
          DRIVE_URL: ${{ secrets.DRIVE_URL }}
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        run: python collect/data/fetch_est.py
