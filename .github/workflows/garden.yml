name: 톰앤수 가든 홈페이지
on:
  push:
    branches: [main]
    paths:
      - "garden/**"
      - ".github/workflows/garden.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: garden-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: garden
      - id: deploy
        uses: actions/deploy-pages@v4
