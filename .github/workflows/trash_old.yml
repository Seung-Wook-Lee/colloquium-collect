name: 드라이브 옛 사본 휴지통(일회용)
# 11/26 의장 "드라이브에 옛 사본 파일 삭제" — collect/data/trash_old_1126.py. 다 되면 이 파일을 지운다.
on:
  workflow_dispatch:
jobs:
  trash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - env:
          DRIVE_URL: ${{ secrets.DRIVE_URL }}
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
        run: python collect/data/trash_old_1126.py
