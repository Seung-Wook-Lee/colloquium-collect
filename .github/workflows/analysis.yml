name: 데이터베이스 검정(손으로)

# 11/26 의장 "에이피알, 블록은 왜 예상 못 했나. 난 실적을 믿었어" — 10년치 데이터베이스(드라이브 1_data/가격10년_*)만 읽고
# 검정 표를 실행 기록에만 찍는다. 아무것도 받지 않고(외부 다운로드 없음) 파일로 남기지 않음.
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'app/block33 안의 검정 코드'
        required: true
        default: 'earn_cost_test.py'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pyyaml
      - name: 데이터베이스 받기와 검정
        env:
          TZ: Asia/Seoul
          DRIVE_URL: ${{ secrets.DRIVE_URL }}
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
          SCRIPT: ${{ github.event.inputs.script }}
        run: |
          mkdir -p work_db
          python - <<'PY'
          import sys; sys.path[:0] = ['collect', 'collect/data']
          import drive, px_store as PS
          b = drive.get(f'{PS.BASE}/1_data/{PS.name("Close")}'); open(f'work_db/{PS.name("Close")}', 'wb').write(b)
          for k in ('DART재무', 'SEC재무'):   # 칸이 아직 없으면 PS.fetch가 옛 파일을 칸으로 옮기고 옛 파일은 휴지통(11/26 의장 카드)
              print(PS.name(k), '받음' if PS.fetch(drive, k, 'work_db') else '없음')
          PY
          python "app/block33/$(basename "$SCRIPT")" work_db
