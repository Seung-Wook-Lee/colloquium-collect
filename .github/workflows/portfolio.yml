name: 포트폴리오 회의 비중

# 매주 목 10:30(한국) 4개 포트폴리오 목표 비중(%)을 코드로 만든다(11/20 의장 승인안, portfolio/run.py).
# 입력: 드라이브 그날 판정표·발표 json, 유니버스, 지난주 결과. 규칙: 비공개 portfolio.yaml.
# 결과: 드라이브 '콜로키움 수집데이터/포트폴리오회의/YYYYMMDD_포트폴리오.csv·.md', 최신_포트폴리오.csv·.md
on:
  schedule:
    - cron: '30 1 * * 4'      # UTC 01:30 목 = 한국 10:30 목
  workflow_dispatch:
    inputs:
      date:
        description: '그날 자료로 다시 만들기 YYYYMMDD (비우면 오늘, 한국 시간)'
        required: false
        default: ''

concurrency: portfolio

jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: 비공개 설정 받기(team_q colloquium_private, TEAMQ_TOKEN 필요)
        uses: actions/checkout@v5
        with:
          repository: Seung-Wook-Lee/team_q
          ref: main
          path: team_q_private
          sparse-checkout: colloquium_private
          token: ${{ secrets.TEAMQ_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: 라이브러리 설치
        run: pip install -r requirements.txt pyyaml
      - name: 포트폴리오 비중 만들기
        env:
          TZ: Asia/Seoul
          DRIVE_URL: ${{ secrets.DRIVE_URL }}
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
          QC_PRIVATE: ${{ github.workspace }}/team_q_private/colloquium_private
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="--date ${{ github.event.inputs.date }}"; fi
          python app/portfolio/run.py $ARGS
