name: 저녁 8시 한국 자료 수집

# 11/25 의장 "아침 07시에 미국 자료, 저녁에 한국 자료" → "자료 수집을 아침 8시, 저녁 8시로".
# 한국 자료 전부를 한투 접속(토큰) 1번으로 받는다. 같은 job 안 모든 단계가 KIS_TOKEN_FILE 하나를 같이 씀(러너 임시 파일, 끝나면 사라짐).
#   1) 블록: 가격(10년치 데이터베이스에 한국 오늘 장만 덧붙임) · 밸류에이션 · ETF 좌수 · 섹터 ETF 주봉(시타델) · ETF 구성
#   2) 한투 추가 자료(kis_extra) · 신용잔고(저장본에 그날 것만) · 투자자별 순매수(hist_kflow)
# 끝나면 meeting.yml이 미장전 회의 준비를 이어서 돌린다(한투 접속 없음).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1-5'    # UTC 11:00 = 한국 20:00, 평일

concurrency: collect

jobs:
  kr:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Seoul
      KIS_TOKEN_FILE: /tmp/kis_token.json
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      DART_KEY: ${{ secrets.DART_KEY }}
      FRED_KEY: ${{ secrets.FRED_KEY }}
      SEC_EMAIL: ${{ secrets.SEC_EMAIL }}
      DRIVE_URL: ${{ secrets.DRIVE_URL }}
      DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pyyaml
      - name: 한국 블록(가격·밸류에이션·ETF 좌수·섹터 ETF 지도(시타델, 데이터베이스로 계산)·ETF 구성)
        run: python collect/run.py b01_prices b02_kis b09_flow.py b09_citadel b09_etfpdf
      - name: 한투 추가 자료
        if: always()
        run: python collect/data/kis_extra.py
      - name: 신용잔고(그날 것만)
        if: always()
        run: python collect/data/kis_credit.py
      - name: 증권사 투자의견(새 보고서만 — 11/26 의장 "최근 일주일 보고서만")
        if: always()
        run: python collect/data/kis_opinion.py
      - name: 투자자별 일별 순매수(B19·B14·B22)
        if: always()
        run: python collect/data/hist_kflow.py
      - name: 관세청 화장품 수출(새 달만, 한투 접속 없음 — 11/26 의장 허락)
        if: always()
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python collect/data/customs.py
      - name: DART 지역별 매출(새 보고서만, 한투 접속 없음 — 11/26 의장 에이피알)
        if: always()
        env:
          DART_KEY: ${{ secrets.DART_KEY }}
        run: cd collect && python -m data.run --only 1-11
      - name: 보조 자료(시장위험·사건 RSS·미장전 시세 — 회의는 받지 않고 이것만 읽음)
        if: always()
        run: pip install pyyaml && python collect/data/supplement.py 저녁
