name: 회의 원고 자동 생성

# 아침 8시 '스튜디오 톰앤수 자료수집'(미국)이 끝나면 국장전 원고, 저녁 8시 '저녁 8시 한국 자료 수집'이 끝나면 미장전 원고(YYYYMMDD_미장전_*)(11/25 의장). 한투 접속 없음.
# 하는 일: 드라이브 07시 파일 받기 → 사건상태·변수달력(규칙) → 야후 보조 자료 → 퀀트센터 엔진 → 위원 원고(meeting/personas.py) → 드라이브
# 결과: 드라이브 '콜로키움 수집데이터/YYYYMMDD/YYYYMMDD_회의원고.txt'·_발표.json·_오늘의한종목.csv·_판정표.csv, '최신_회의원고.txt'
on:
  workflow_run:
    # 11/25 의장 "자료 수집을 아침 8시, 저녁 8시로": 아침 8시 수집이 끝나면 국장전, 저녁 8시 한국 수집이 끝나면 미장전.
    workflows: ['스튜디오 톰앤수 자료수집', '저녁 8시 한국 자료 수집']
    types: [completed]
  workflow_dispatch:
    inputs:
      session:
        description: '회의: 국장전(10시) 또는 미장전(22시)'
        required: false
        default: '국장전'
      date:
        description: '그날 자료로 다시 만들기 YYYYMMDD (비우면 오늘, 한국 시간)'
        required: false
        default: ''
      skip_fetch:
        description: '야후 보조 자료 갱신 건너뛰기(전날 것 사용) — yes'
        required: false
        default: ''
      backtest:
        description: '블록 성적표·블록점수이력을 금요일이 아니어도 돌리기 — yes'
        required: false
        default: ''

concurrency: meeting

jobs:
  meeting:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: 팀Q 아침보고·퀀트자료 받기(TEAMQ_TOKEN 있을 때만, 없으면 전날 사본)
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          repository: Seung-Wook-Lee/team_q
          ref: block20-V2611
          path: team_q
          sparse-checkout: research/daily
          token: ${{ secrets.TEAMQ_TOKEN }}
      - name: 비공개 설정 받기(블록 문턱·종목 목록·판단 코드, team_q colloquium_private. TEAMQ_TOKEN 필요)
        uses: actions/checkout@v5
        with:
          repository: Seung-Wook-Lee/team_q
          ref: main
          path: team_q_private
          sparse-checkout: colloquium_private
          token: ${{ secrets.TEAMQ_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: 라이브러리 설치
        run: pip install -r requirements.txt pyyaml
      - name: 회의 원고 만들기
        env:
          TZ: Asia/Seoul
          DRIVE_URL: ${{ secrets.DRIVE_URL }}
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
          TEAMQ_DIR: ${{ github.workspace }}/team_q
          QC_PRIVATE: ${{ github.workspace }}/team_q_private/colloquium_private
          FRED_KEY: ${{ secrets.FRED_KEY }}
          KIS_OFF: '1'      # 11/25 의장: 회의 준비는 한투 접속 없이 저장본만(한국은 저녁 8시 수집이 받아 둠)
          DART_KEY: ${{ secrets.DART_KEY }}             # 11/22 한투 분기 손익이 안 되면 DART
          BACKTEST: ${{ github.event.inputs.backtest == 'yes' && '1' || '' }}
        run: |
          ARGS=""
          if [ "${{ github.event.workflow_run.name }}" = "저녁 8시 한국 자료 수집" ]; then ARGS="--session 미장전"; fi
          if [ -n "${{ github.event.inputs.session }}" ]; then ARGS="--session ${{ github.event.inputs.session }}"; fi
          if [ -n "${{ github.event.inputs.date }}" ]; then ARGS="$ARGS --date ${{ github.event.inputs.date }}"; fi
          if [ "${{ github.event.inputs.skip_fetch }}" = "yes" ]; then ARGS="$ARGS --skip-fetch"; fi
          python app/meeting/daily.py $ARGS
      - name: 위원 공부 후보 모으기(국장전 원고 뒤, 의장 승인 대기)
        if: github.event.workflow_run.name != '저녁 8시 한국 자료 수집'
        continue-on-error: true
        env:
          TZ: Asia/Seoul
          DRIVE_URL: ${{ secrets.DRIVE_URL }}
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python app/meeting/study.py shelf || true   # 승인 화면에서 승인한 자료 → 서재 카드(드라이브)
          python app/meeting/study.py gather
