name: 팀Q 과거데이터 (일회성)

# 기존 '콜로키움 자료수집'(07시)과 완전히 별개. 예약 실행 없음.
# 실행: Actions 화면 'Run workflow' 또는 teamq/trigger.txt 를 고쳐 push (안에 단계 이름, all 이면 전부)
on:
  workflow_dispatch:
    inputs:
      parts:
        description: '돌릴 단계(띄어쓰기). 비우면 전부: prices etf macro fund_us fund_kr fund_jp earnings_dates valuation events quality'
        required: false
        default: ''
  push:
    paths:
      - 'teamq/trigger.txt'

concurrency: teamq

jobs:
  teamq:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: 라이브러리 설치
        run: pip install -r teamq/requirements.txt
      - name: 과거 데이터 수집
        env:
          TZ: Asia/Seoul
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
          DART_KEY: ${{ secrets.DART_KEY }}
          SEC_EMAIL: ${{ secrets.SEC_EMAIL }}
          DRIVE_URL: ${{ secrets.DRIVE_URL }}          # 기존 자료 '읽기'만
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
          TEAMQ_DRIVE_URL: ${{ secrets.TEAMQ_DRIVE_URL }}
          TEAMQ_DRIVE_TOKEN: ${{ secrets.TEAMQ_DRIVE_TOKEN }}
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
          EDINET_KEY: ${{ secrets.EDINET_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          PARTS: ${{ github.event.inputs.parts }}
        run: |
          if [ -z "$PARTS" ] && [ "${{ github.event_name }}" = "push" ]; then PARTS=$(cat teamq/trigger.txt); fi
          [ "$PARTS" = "all" ] && PARTS=""
          python teamq/run.py $PARTS
      - name: 결과 보관(드라이브 창구가 없을 때 대비, 7일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teamq_out
          path: teamq_out
          retention-days: 7
