name: 콜로키움 조사 실행

on:
  workflow_dispatch:          # 회의실이 손으로 돌리는 일회성 조사(결과는 실행 로그로 읽는다)
    inputs:
      script:
        description: 'research/ 아래 실행할 파일 이름(예: putcall_history.py)'
        required: true

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 조사
        env:
          TZ: Asia/Seoul
          SCRIPT: ${{ github.event.inputs.script }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          DRIVE_URL: ${{ secrets.DRIVE_URL }}
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
          QUIET: '1'
        run: python "research/$(basename "$SCRIPT")"
      - name: 결과 파일 저장(research/out이 있으면 같은 브랜치에 커밋)
        if: always()
        run: |
          if [ -d research/out ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research/out
            git commit -m "조사 결과 파일 저장: $SCRIPT" || exit 0
            git push
          fi
        env:
          SCRIPT: ${{ github.event.inputs.script }}
