제목: 미국주식 150일선·200일선 터치·이탈·재돌파 검증
설명: '11/15 의장: 미국은 150·200일선을 많이 본다, 60·120일선 보완 필요한가. 미국 유니버스(개별주·ETF, 현금성·SPYM·QQQM 제외) + SPY·QQQ 긴 역사. 같은 자료·같은 기간에서 지금 보는 60·120일선, 60주선 첫 터치와 나란히 비교. 룰 아님, 룰 후보 검증용. 손절·추세추종으로 쓰지 않음.'
출처: 의장 2026-11-15, 와인스타인 30주선(≈150일)·40주선(≈200일)
기본봉: 일봉
자료: 야후
