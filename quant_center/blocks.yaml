    공식:
    - [업종 사건 낱말 오늘 뉴스에 없음 + 진행 중 사건(사건상태.csv) 없음, not event_hit, 확정, 11/15·11/16 의장]
    - [7일 안 대형 이벤트(변수달력 날짜·영향 층) 앞이 아님 = 수급 경계, event_near != 1, 확정, 11/17 의장 엔비디아 실적·앤트로픽 상장]
  B11:
    질문: 추천할 만큼 큰 회사인가? (연매출 10조 원 이상, 아니면 참고만)
