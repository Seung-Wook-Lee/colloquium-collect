# 퀀트센터 질문 블록 (레고식). 블록 = 질문 하나, 공식 = 그 질문에 답하는 식.
# 공식을 더하거나 빼려면 이 파일에 한 줄만. 식은 종목 한 줄(features.py가 만든 칸)에 대한 파이썬 식.
# 순서: 거르기 통과 → 싼가(핵심) 점수로 줄 세움 → 같은 싼가 점수 안에서 나머지 점수 평균으로 순서.
# 역할: 거르기(통과해야 후보) / 점수(평균 점수에 들어감) / 타이밍(분할 차수) / 매도(감점·매도 후보) / 비중
# 상태: 11/16 의장 "다 승인" → 모두 확정. 검증은 나중.
# 대상: 개별주 / 전체 (ETF는 실적 등 해당 없는 칸이 자료 없음으로 빠짐)

# 번호: B01~B08 시장, B09~B25 종목, B26 분할 차수·B27 비중 상한·B28 팔 때는 엔진이 계산.
시장:
  B01:
    질문: 시장 국면은?
    공식:
    - [한국 HMM 하락 국면 확률 50% 이상(부담), KR_BEAR >= 0.5, 부담]
    - [미국 HMM 하락 국면 확률 50% 이상(부담), US_BEAR >= 0.5, 부담]
  B02:
    질문: 변동성은 기회인가 위험인가?
    공식:
    - [VIX 15.5 이하 과열(부담), VIX <= 15.5, 부담]
    - [MOVE 100 이상 저점 구간(기회), MOVE >= 100, 기회]
    - [VIX > VIX3M 단기 공포(기회), VIX_VIX3M > 0, 기회]
  B03:
    질문: 신용·자금 경색이 있나?
    공식:
    - [HY 스프레드 5% 이상 위기(부담), HY >= 5, 부담]
    - [HY 3~4% 주의(부담), 3 <= HY < 5, 부담]
    - [금융 스트레스 0 위(부담), STLFSI > 0, 부담]
    - [SOFR−IORB 0.5 넘음(부담), SOFR_IORB > 0.5, 부담]
  B04:
    질문: 금리가 부담인가?
    공식:
    - [10년물 5.0% 이상(부담), US10Y >= 5.0, 부담]
    - [10년물 4.8% 이상(부담), US10Y >= 4.8, 부담]
    - [10Y−2Y 마이너스(부담), T10Y2Y < 0, 부담]
  B05:
    질문: 공포가 극단인가?
    공식:
    - [공포탐욕 10 아래 매수 신호(기회), FG < 10, 기회]
    - [공포탐욕 75 이상 과열(부담), FG >= 75, 부담]
  B06:
    질문: 수급 포지셔닝이 바닥·고점인가?
    공식:
    - [CTA positioning −4σ 아래(기회), CTA <= -4, 기회]
    - [Vol-target exposure 0.6배 아래 = 이미 많이 팜(기회), VOLT < 0.6, 기회]
    - [국내 지수·커버드콜·미국지수 ETF 5일 유입 = 불안(부담), KR_SAFE_FLOW5 > 0, 부담]
  B07:
    질문: 분산이 깨졌나?
    공식:
    - [종목 간 20일 평균 상관이 1년 평균보다 0.15 이상 높음(부담), CORR_JUMP >= 0.15, 부담]
  B08:
    질문: 시장이 비싼가?
    공식:
    - [S&P500 선행 PER 20배 이상(부담), SPX_FPER >= 20, 부담]
    - [S&P500 선행 PER 16배 이하(기회), SPX_FPER <= 16, 기회]
    - [코스피 50일 이격 125 이상 과열주의(부담), KS_GAP50 >= 125, 부담]
    - [코스피 50일 이격 130 이상 과열(부담), KS_GAP50 >= 130, 부담]
  B00:
    질문: AI 묶음에서 돈이 빠져 방어로 가나?
    공식:
    - [AI 묶음÷금융·방어 비율 50일선 아래 + 20일 하락 = 방어 국면(부담), ROT_DEF == 1, 부담]
종목:
  B09:
    질문: 이익이 늘고 있나?
    역할: 거르기
    대상: 개별주
    통과식: (op_yoy > 0 and opm_ok == 1) or earn_relief == 1
    공식:
    - [최근 분기 이익 전년비 증가, op_yoy > 0, 확정, 11/15 의장]
    - [이익률 전년비 개선(금융은 순이익÷영업수익), opm_yoy >= 0, 확정, 11/15 의장]
    - [OPM 2분기 연속 개선, opm2 == 1, 확정, 11/15]
    - [매출 전년비 증가, rev_yoy > 0, 확정, 11/15 의장]
    - [한 분기 꺾여도 앞 분기 증가 + 추정치 상향이면 통과, earn_relief == 1, 확정, 11/16 의장 한 분기 꺾임]
  B10:
    질문: 사건 역풍이 있나?
