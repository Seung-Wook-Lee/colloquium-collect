제목: 미스 차트 바닥 세 조건(의장 기준) 다시 보기
설명: 11/9 의장이 정한 미스 차트 바닥 기준 세 조건만. 일봉 RSI(와일더) 30 이하 + 50일 이격도 90 이하 + 월봉 5개월선 아래. 월봉은 그날까지 끝난 달 기준이라 m.ma5(지난달까지 5개월 평균)와 그날 일봉 종가를 비교.
출처: 의장 2026-11-09 (미스 차트 바닥 기준), 실험실 예시 겸 기준선
기본봉: 일봉
자료: 한투

규칙:
  - 이름: M1_바닥세조건
    구분: 의장기준
    조건:
      - d.rsi <= 30
      - d.disp50 <= 90
      - d.close < m.ma5
    기록: [rsi, disp50]
  - 이름: M1a_RSI만
    구분: 비교
    조건:
      - d.rsi <= 30
  - 이름: M1b_이격도만
    구분: 비교
    조건:
      - d.disp50 <= 90
