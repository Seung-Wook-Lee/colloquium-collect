# ---------------------------------------------------------------- 변수 달력(변수달력.csv) — 07시 일정.csv(DART 공시·FRED 발표 달력·야후)에서만
변수:
  일수: 14
  대형_미국_시총(백만달러): 1000000     # 1조 달러 이상 미국 종목 실적
  대형_한국_시총(억원): 1000000         # 100조 원 이상 한국 종목 '실적' 공시(IR 개최 안내는 제외)
  AI층: [S1, S2, S3]                    # AI 층 종목 실적이면 AI 층 전체가 영향 층
