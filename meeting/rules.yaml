  지표_낱말: "FOMC|CPI|Consumer Price|PCE|Personal Income|Employment Situation|고용"   # 확정 지표는 기록만(영향 층 비움)

# ---------------------------------------------------------------- 돌발 질문(원고에 없는 질문) — meeting/ask.py
# 2026-11-19 의장: 원고는 그대로 읽고, 돌발 질문도 프로그램이 답한다. Claude는 아래 순서로 ask.py를 돌려 나온 글을 그대로 옮긴다.
# ① 질문에 종목 이름(판정표 종목·종목색인 별칭)이 있으면 → 그 종목 담당 위원이 그날 판정표 줄을 읽는다(여러 종목이면 비교표).
# ② 위원 이름이 있으면 → 그날 회의원고의 그 위원 칸을 그대로.
# ③ 아래 낱말이 있으면 → 그 위원 칸을 그대로(위에서부터 처음 맞는 줄).
# ④ 하나도 없으면 → '룰 미정' 한 줄 + 장부에 기록(의장이 규칙을 정하면 이 파일이나 personas.py에 넣는다).
돌발질문:
  종목칸: [판정, 추천, 국면, 갈래, 블록예비율, 싼가, 점수, 블록 예, 블록 아니오, 매도신호, 경보, 빠지는 이유, 5일(%), 20일(%), 변동성60(%), Sigma Check]
  위원낱말:
    - [아트로포스, "매도|팔아|팔까|과열|차익|익절"]
    - [클로토, "바닥|저점|물타|진입 시점"]
    - [미스 시타델, "수급|외국인|기관|개인|순매수|순매도|CTA|ETF 자금|포지션"]
    - [미스 리스크, "공포|탐욕|VIX|심리|Fear|Greed|리스크|금리|국채|CPI|PCE|인플레|하이일드|스프레드|현금|투입|이격"]
    - [미스 밸류, "PER|PBR|밸류|싼가|비싼|저평가|고평가"]
    - [미스 차트, "차트|RSI|MACD|이평|이동평균|지지|저항|추세선"]
    - [뚜지, "추천|퀀트|블록|엔진|포트폴리오|7종목"]
    - [엘피스, "호재|긍정|좋은 점|반등"]
    - [국장, "뉴스|기사|일정|실적 발표|발표일|사건|변수|FOMC|협상"]
    - [미스터 마켓, "시장|지수|코스피|코스닥|나스닥|S&P|다우|국면|증시|선물|유럽|DAX|달러|환율|유가|WTI|비트코인|미장|오늘 밤"]
  # 낱말이 여러 위원에 걸치면(예: '코스피 이격 바닥') 낱말을 모두 담은 원고 항목만 읽고, 없으면 룰 미정(관련 항목은 참고로만).
  항목최대: 8
  장부: 회의록/돌발질문_장부.csv   # /mnt/project-files 아래(없으면 실행 폴더)

# ---------------------------------------------------------------- 미장전 회의(22:00, 2026-11-19 의장: 하루 두 번 — 10시 국장전, 22시 미장전)
# meeting.yml이 21:00(한국)에 --session 미장전으로 돈다. 07시 파일 + 야후 가격(오늘 한국 종가까지) + RSS를 다시 받아 엔진을 다시 돌리고,
# 원고 맨 앞에 '0 미장전 시황'(미스터 마켓)을 붙인다. 파일 이름은 YYYYMMDD_미장전_*.
미장전:
  시세:   # [이름, 야후 티커] — 지금 값과 전일 종가 대비
    - [코스피 종가, "^KS11"]
