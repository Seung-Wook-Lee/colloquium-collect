# 회의 원고 규칙 — 위원 발언·오늘의 한 종목·사건·변수달력을 만드는 규칙 전부 (2026-11-17 의장: "페르소나 고치라고 하면 코드만 고쳐")
# 위원 말을 바꾸려면 이 파일(숫자·낱말·순서)이나 meeting/personas.py(문장 틀)만 고친다. AI가 문장을 쓰지 않는다.
# 종목 판단은 퀀트센터 엔진(quant_center/blocks.yaml) 결과만 읽는다. 여기서는 엔진 결과를 '어떤 순서로 누가 읽나'만 정한다.

회의순서:   # 콜로키움_룰.txt 3장 순서 + 지침의 위원(닉스 팀·미스 밸류·섹터 데스크·국장)
  - 미스터 마켓
  - 미스 시타델
  - 미스 리스크   # 11/20 리오·포보스 합침
  - 뚜지
  - 미스 차트
  - 클로토
  - 라케시스
  - 아트로포스
  - 미스 밸류
  - 섹터 데스크
  - 엘피스
  - 국장

금지이름: [카카오, LIG, LG, LS]   # 콜로키움_룰.txt 4장 — 이 이름으로 시작하는 종목·기사는 원고에 넣지 않는다

# ---------------------------------------------------------------- 오늘의 한 종목
# 모든 고르기는 엔진 판정표(out_판정표.csv)의 칸만 쓴다. 후보가 없으면 '오늘은 해당 없음'.
# 공통 바탕: 판정 = 후보, 추천 등급 순서(추천 → 관찰), 같은 등급 안에서는 아래 '정렬' 순서.
한종목:
  센터:        {대상: 오늘의 추천 종목 1번, 설명: "엔진 추천 7종목(blocks.yaml 추천 설정) 중 첫 번째"}
  뚜지:        {대상: 오늘의 추천 종목 1번, 설명: "엔진 추천 7종목 중 첫 번째(블록 예 비율 → 싼가 → 점수 순)", 없을때: "추천 7종목이 비면 엔진 추천 등급 1위(블록 예 비율 → 싼가 → 점수)를 [주목]으로 — 국내 상장 조건 밖이면 편입 대상 아님"}
  미스 차트:   {등급: [추천], 조건: "turn_ok == 1", 정렬: [블록예비율, 싼가], 설명: "추천 등급 중 주봉 MACD 오실레이터 2주 연속 상승 또는 50일선 위"}
  클로토:      {등급: [추천, 관찰], 조건: "osc_w > osc_w1 and rsi_w <= 45", 정렬: [rsi_w_asc], 설명: "주봉 MACD 오실레이터 상승 전환 + 주봉 RSI 45 이하 중 주봉 RSI가 가장 낮은 종목"}
  라케시스:    {등급: [추천, 관찰], 조건: "갈래 == '주도'", 정렬: [블록예비율, ret126], 설명: "52주 고점 10% 안(주도) 종목 중 블록 예 비율 → 126일 수익률 순"}
  아트로포스:  {등급: [전체], 조건: "매도신호 != ''", 정렬: [rsi_d], 표시: 제외, 설명: "엔진 매도 신호(B28)가 붙은 종목 중 일봉 RSI가 가장 높은 종목"}
  미스 밸류:   {등급: [추천, 관찰], 조건: "per_pct3 == per_pct3", 정렬: [per_pct3_asc, 싼가], 구분: 개별주, 설명: "자기 3년 PER 백분위가 가장 낮은 종목"}
  미스 시타델: {등급: [추천, 관찰], 조건: "f5 > 0 and f20 > 0", 정렬: [f5], 시장: 한국, 구분: 개별주, 설명: "외국인 5일·20일 동시 순매수 중 5일 순매수 금액이 가장 큰 종목"}
  엘피스:      {등급: [추천, 관찰], 조건: "갈래 == '눌림' and 가짜바닥아님 == 1 and 구간200 == '안'", 정렬: [블록예비율, dd52_asc], 설명: "52주 고점에서 10% 넘게 떨어진 종목(눌림) 중 현재가가 200일선의 {하단}~{상단}배 사이인 종목(아래는 추세 무너짐으로 뺌)에서 블록 예 비율 → 낙폭 큰 순"}
  섹터 데스크: {등급: [추천, 관찰], 조건: "True", 정렬: [블록예비율, 싼가], 구분: 개별주, 설명: "담당 종목 중 엔진 추천 → 관찰 순, 블록 예 비율 → 싼가 순"}

# ---------------------------------------------------------------- 섹터 데스크 담당
# 유니버스 '섹터/테마' 낱말로 배정(위에서부터 처음 맞는 줄). 종목명 지정이 낱말보다 먼저. 층 S0(지수·현금·금)은 리오팀.
데스크:
  종목지정:
    닛토보세키: 일라이 존슨
    아지노모토: 일라이 존슨
    소프트뱅크그룹: 미스 파이낸스
    이토추: 미스 파이낸스
    삼성SDI: 미스터 로보
    애플: 미스터 빅스
    Linde plc: 마담헤비
    Apple: 미스터 빅스
  낱말:
    - [미스 세마이, "반도체|MLCC|전자부품|하드웨어|광통신|기판|소켓|TC본더|웨이퍼|포토레지스트|불화수소|HBM|네트워크 장비|IT"]
    - [미스터 빅스, "빅테크|인터넷|소프트웨어|클라우드|통신|스트리밍|사이버보안|플랫폼|이커머스|미디어|엔터|정밀의료"]
    - [미스터 로보, "로봇|자동차|전기차|2차전지|우주|모빌리티|감속기|배터리|FA"]
    - [미스 파이낸스, "금융|은행|증권|보험|자산운용|투자은행|결제|카드|핀테크|지주|상사"]
    - [마담헤비, "전력|원전|원자력|우라늄|조선|방산|항공|발전|연료전지|유틸리티|클린에너지|건설|기계|산업재|폐기물|석유|가스|에너지|철강"]
    - [일라이 존슨, ".*"]
  보고문턱_등락(%): 3      # 담당 종목 전일 등락이 ±3% 이상이면 숫자 보고
  실적일수: 3              # DART 잠정 공시일·SEC 실적 받은날이 3일 안이면 실적 보고

# ---------------------------------------------------------------- 위원별 숫자 문턱
# 결론(11/20 의장 '지금 살 때인가 · 오래 가져갈 것 무엇'): 숫자는 비공개 blocks.yaml '결론:' 칸(daily.py가 R['결론']으로 넣음)
# 반대(11/20 의장 '회의니까 다른 위원이 반대'): 규칙은 비공개 blocks.yaml '반대:' 칸(daily.py가 R['반대']로 넣음)
미스터 마켓:
  # 11/20 의장: 미스터 마켓은 개별 종목을 말하지 않는다(크게 움직인 종목은 섹터 데스크가 기사와 함께).
  # 오전 국장전 = 간밤 미국 시장만, 밤 미장전 = 한국 시장만.
  회의별:
    국장전:
      국면: [미국]
      지수제목: 미국 지수(간밤)
      지수: [S&P500, 나스닥, 다우, 필라델피아 반도체(SOX)]
      코스피이격: false
    미장전:
      국면: [한국]
      지수제목: 한국 지수(오늘)
      지수: [코스피, 코스닥]
      코스피이격: true
  코스피이격_주의: 125       # 코스피 50일 이격(의장 기준)
  코스피이격_과열: 130
미스 리스크:   # 11/20 의장: 리오(여건)·포보스(공포탐욕)를 합친 위원
  # 투입 여건: 엔진 시장 블록(out_시장블록.csv)의 '기회' 통과 공식 수가 '부담' 통과 공식 수보다 많고, 두 시장 모두 방어 국면이 아니면 '됨'
  여건_규칙: "기회 > 부담 and not 방어"
  구간: [[0, 24, Extreme Fear], [25, 44, Fear], [45, 55, Neutral], [56, 75, Greed], [76, 100, Extreme Greed]]
미스 시타델:
  상위: 3
  CTA_바닥: -4               # 수급포지셔닝 '읽는 법': 처음 −4σ 아래 = 수급 바닥 구간
  CTA_고점: 4
  볼타깃_많이팜: 0.6        # 엔진 시장 블록과 같은 문턱: 변동성 타기팅 노출 0.6배 아래 = 이미 많이 팜(기회)
엘피스:
  상위: 3
국장:
  승인매체: [연합, 매경, 매일경제, 조선, CNBC, CNN, 블룸버그, Bloomberg, 닛케이, Nikkei, NHK, 닛칸코교]
  기사수: 6
  일정일수: 2                # 오늘·내일 일정만

# ---------------------------------------------------------------- 사건 상태(사건상태.csv) — 승인 매체 RSS 제목으로만
# 규칙: 최근 '유지일' 안에 승인 매체 제목에 '낱말' 중 하나가 나오면 '진행 중(최근 보도 날짜)'. 없으면 목록에서 빠진다.
# 업종은 유니버스 '섹터/테마' 안의 글자(엔진 features.py가 이 글자로 종목을 찾는다).
사건:
  - {사건: 러시아·우크라이나 평화협상, 업종: [방산, 우주], 낱말: "평화협상|휴전|종전|ceasefire|peace talks|peace deal|truce", 함께: "러시아|우크라이나|Russia|Ukraine", 유지일: 14}
  - {사건: 중국 YMTC NAND 확대, 업종: [NAND], 낱말: "YMTC|창신메모리|CXMT", 함께: "", 유지일: 21}
  # 새 사건은 의장 지시 때 이 목록에 한 줄 더한다(관세·종전 같은 그날 뉴스 낱말은 엔진 features.py EVENT가 따로 본다).

RSS:   # 승인 매체(콜로키움_룰.txt 4장)만. 실패한 주소는 건너뛴다.
  - [연합, "https://www.yna.co.kr/rss/international.xml"]
  - [연합, "https://www.yna.co.kr/rss/economy.xml"]
  - [매경, "https://www.mk.co.kr/rss/30000001/"]
  - [조선, "https://www.chosun.com/arc/outboundfeeds/rss/category/economy/?outputType=xml"]
  - [조선, "https://www.chosun.com/arc/outboundfeeds/rss/category/international/?outputType=xml"]
  - [CNBC, "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114"]
  - [CNBC, "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100727362"]
  - [블룸버그, "https://feeds.bloomberg.com/markets/news.rss"]
  - [닛케이, "https://asia.nikkei.com/rss/feed/nar"]
